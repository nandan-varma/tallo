version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # cf 1.0.0-beta.13 cannot deploy with newer Wrangler (no build output spec); hold until cf is stable.
      - dependency-name: wrangler
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # astro check does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Peer ranges admit 2.0.0 alphas/betas, which broke astro check; wait for the stable 2.x.
      - dependency-name: "@emnapi/*"
        versions: [">=2.0.0-0 <2.0.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Keep the prerelease-prone packages out of the group; they get their own PRs.
        exclude-patterns: ["@emnapi/*"]
