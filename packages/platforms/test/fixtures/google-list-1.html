<!doctype html><html><body><script class="ds:1" nonce="fixture">AF_initDataCallback({key: 'ds:1', hash: '2', data: [[["78511373281043142","Staff Machine Learning Engineer, YouTube Live Discovery","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckePKBntuVSdqLeZ4EUauSz6WOlRd7LIjkSvq0aY7xh5YEjsA9yzvgivgwlIAEcK5sAlAD7od_FSq2eMik9x96usP7tw-275WomMKjjk7WwLX5PVrxsU1DErWGP6bGg%3D%3D_V2&loc=US&title=Staff+Machine+Learning+Engineer",[null,"<ul>\n<li>Lead the technical goal and architecture for YouTube Live discovery and recommendation ML systems.</li>\n<li>Develop state-of-the-art deep learning models to improve real-time engagement and viewer retention on live streams.</li>\n<li>Scale high-throughput, low-latency machine learning pipelines to handle massive real-time streaming data concurrent traffic.</li>\n<li>Mentor junior and senior engineers, fostering technical growth and engineering excellence across the ML organization.</li>\n<li>Design ranking, retrieval, and candidate generation algorithms tailored for live and real-time content.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li><div><div>8 years of experience designing, building, and operating large-scale distributed systems, with a focus on scalability, fault tolerance, and reliability.</div></div></li>\n<li>Experience developing recommender/ranking/prediction systems for personalized content delivery.</li>\n<li>Experience in building and architecting ML systems and infrastructure (e.g., for model training, evaluation, deployment, serving).</li>\n<li>Experience working with consumer-facing video, audio or streaming platforms.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience in building and deploying recommendation systems models (retrieval, prediction, ranking, personalization, search quality, embedding) in production.</li>\n<li>Experience in distributed Machine Learning and Machine Learning infrastructure, distributed systems and with Machine Learning algorithms at scale.</li>\n<li>Experience in designing, building, and operating large-scale distributed systems, with a focus on scalability, fault tolerance, and reliability.</li>\n<li>Experience in Machine Learning model development and deployment frameworks (e.g., PyTorch, Tensorflow, Jax, Ray), AI accelerators (e.g., TPUs, GPUs), model architectures (e.g., encoders, decoders, transformers), or APIs.</li>\n<li>Experience in search and information retrieval.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ad872500-709d-4a93-97e3-76be227f77a1",null,"YouTube","en-US",[["Mountain View, CA, USA",["Mountain View, CA, USA"],"Mountain View",null,"CA","US"]],[null,"<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google\u2019s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>As a (TL) Technical Lead, you will work on improving Machine Learning (ML) algorithms and end-to-end solutions to empower live recommendations and grow live ecosystems responsibly. You will set up growth metrics and goals, conduct analysis and research to identify growth areas, and lead a team of engineers to iterate experiments toward launch. </p><div>Additionally, you will communicate across YouTube engineering teams and leads, to align with the design direction and future plans of your projects. In this position, you will work with YouTube Discovery teams (e.g., Home, Shorts, WatchNext, Notifications, Living Room), Live Infrastructure, and Live Experience teams, and collaborate with Google DeepMind, YouTube Knowledge, and YouTube Trust and Safety (TnS) teams.</div><p>At YouTube, we believe that everyone deserves to have a voice, and that the world is a better place when we listen, share, and build community through our stories. We work together to give everyone the power to share their story, explore what they love, and connect with one another in the process. Working at the intersection of cutting-edge technology and boundless creativity, we move at the speed of culture with a shared goal to show people the world. We explore new ideas, solve real problems, and have fun \u2014 and we do it all together.</p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $207000 - $300000 (USD) + 20% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1795158483,605000000],[1795158483,605000000],[1795158485,161000000],[null,""],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li><div><div>8 years of experience designing, building, and operating large-scale distributed systems, with a focus on scalability, fault tolerance, and reliability.</div></div></li>\n<li>Experience developing recommender/ranking/prediction systems for personalized content delivery.</li>\n<li>Experience in building and architecting ML systems and infrastructure (e.g., for model training, evaluation, deployment, serving).</li>\n<li>Experience working with consumer-facing video, audio or streaming platforms.</li>\n</ul>"],3],["141234113599152838","Account Manager, Large Customer Sales","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckXAGe9dt0ZiU5tTH4GnMm88_TSH8JuIqh741udbsfXzrEjsA9yzvgovKpZ66XWi2tr5BD8--HgM2p4I_f0qHbbZEjHLJo5M-fEtymO4C3Ib9JE3274I2Wrkd_DZcvQ%3D%3D_V2&loc=TH&title=Account+Manager",[null,"<ul>\n<li>Engage and influence key customer stakeholders by leading meetings to uncover marketing goals and key performance indicators, translating them into actionable campaign strategies.</li>\n<li>Drive exceptional campaign results, quantify business impact, and demonstrate value to customers, maintaining account hygiene.</li>\n<li>Build and pitch data-driven solutions to maximize customer value through Google\u2019s advertising solutions, manage objections, and ultimately achieve sales growth goals.</li>\n<li>Analyze campaign data, ensuring performance is accurately tracked, and delivering measurable results aligned with customer objectives.</li>\n<li>Monitor performance data to extract key insights, identifying and cultivating qualified promote opportunities to drive future customer growth and build pipelines.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>2 years of experience in digital advertising, consultative sales, digital media sales, business development, online media environment, or digital marketing roles.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>6 years of experience in sales and business development, product marketing, digital media, technology sales or agency.</li>\n<li>Experience using Google and YouTube advertising solutions.</li>\n<li>Experience in business development, client relationship management and servicing, and consultative selling.</li>\n<li>Knowledge of Thailand marketing and the media industry.</li>\n<li>Understanding of industry wide digital advertising and media products.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bangkok, Thailand",["Bangkok, Thailand"],"Bangkok",null,"Bangkok","TH"]],[null,"Businesses of all shapes and sizes rely on Google\u2019s unparalleled advertising solutions to help them grow in today's dynamic marketing environment. You bring a passion for sales, knowledge of online media, and commitment to maximize customer success. You act like an owner, move with velocity through change, finding innovative and strategic ways to consistently deliver extraordinary and incremental outcomes for both Google and your customers. You build trusted relationships with customers, uncovering their business needs and translating them into powerful solutions to achieve their most ambitious goals. You achieve as a team with sellers, shape the future of advertising in the AI-era, and make a real impact on the millions of companies and billions of users that trust Google with their most important goals. <br><br>As an Account Manager, you will provide advertising solutions to consumers and businesses. You will be working closely with the Industry Manager and Cross-Functional teams to develop Google's marketplace, you will combine a passion for the industry and demonstrated fluency in the language of media with effective presentation and communication skills. You will manage the relationships with clients and agencies, identifying, educating and developing clients in order to drive their business growth.Google's Large Customer Sales (LCS) teams are strategic partners and industry thought leaders to the world's leading brands and agencies. We continuously challenge how customers think about their business and how Google can support growth. We focus on helping these players navigate profound industry shifts and drive outsized business performance by competitively selling Google's full suite of advertising solutions across Search, YouTube, Measurement, and more. As a member of our LCS team, you'll have the unique opportunity to sell at the forefront of technology, collaborating with executives, influencing market-shaping strategies, and delivering tangible results that significantly impact major global businesses and drive the growth of Google."],[2],[1795160448,30000000],[1795160448,30000000],[1795160448,240000000],[null,"Google will be prioritizing applicants who have valid working rights in Thailand and do not require Google\u2019s sponsorship of a visa."],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>2 years of experience in digital advertising, consultative sales, digital media sales, business development, online media environment, or digital marketing roles.</li>\n</ul>"],1]],null,3,2], sideChannel: {}});</script></body></html>
