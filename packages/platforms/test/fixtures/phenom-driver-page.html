er from the comfort of &lt;strong&gt;your own vehicle&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;Excellent hourly rate, paid weekly, including mileage reimbursement of $0.76 per mile&lt;/li&gt;&lt;li&gt;No prior experience required&lt;/li&gt;&lt;li&gt;Opportunity to gain experience with an industry-leading company&lt;/li&gt;&lt;li&gt;Potential future career opportunities with UPS*&lt;/li&gt;&lt;/ul&gt;\r\n&lt;p&gt;*This is a seasonal role. A seasonal job is a great place to start at UPS. Although continued employment is not guaranteed beyond the seasonal period, many team members begin in seasonal roles and later pursue additional opportunities with UPS. Shifts vary between Monday - Saturday, depending on business needs. Work assignments are communicated via calls/text to your phone.&lt;/p&gt;\r\n&lt;p&gt;This job posting includes information about the minimum qualifications, including the UPS Uniform and Personal Appearance Guidelines, locations, shifts, and operations within the locations that may consider your application. An applicant or employee may request an exception, change, or accommodation for any condition of employment, including the UPS Uniform and Personal Appearance Guidelines.&lt;/p&gt;\r\n&lt;p&gt;&lt;strong&gt;&lt;br /&gt;&lt;/strong&gt;&lt;/p&gt;\r\n&lt;p&gt;\r\n&lt;/p&gt;\r\n&lt;p&gt;&lt;strong&gt;The base pay for this position is $23.00/hour&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;UPS is committed to providing a workplace free of discrimination, harassment, and retaliation. UPS is an equal opportunity employer. UPS does not discriminate on the basis of race/color/religion/sex/national origin/veteran/disability/age/sexual orientation/gender identity or any other characteristic protected by law.&lt;/p&gt;","title":"Seasonal Support Driver","datePosted":"2026-11-21","@context":"http://schema.org","occupationalCategory":"Operations","directApply":false}</script></head><body></body></html>
