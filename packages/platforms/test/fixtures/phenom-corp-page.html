ow—people with a unique combination of skill &#43; passion. If you have the qualities and drive to lead yourself or teams, there are roles ready to cultivate your skills and take you to the next level.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job Description:&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;The Director of Software Engineering is responsible for leading multiple software engineering teams that design, develop, modernize, and support business-critical applications for iShip, the shipping platform that supports more than 5,500 The UPS Store locations. This role provides strategic and operational leadership across application delivery, software architecture, platform modernization, reliability, and engineering excellence. The Director partners closely with Product Management, Architecture, Site Reliability Engineering (SRE), and business stakeholders to deliver innovative solutions that drive business value while ensuring system stability, scalability, security, and performance.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;The role is accountable for the successful delivery and evolution of a portfolio of applications built primarily on the Microsoft technology stack, including .NET, Azure, SQL Server, APIs, and modern cloud-native technologies. The Director will lead efforts to deliver new business capabilities, maintain and enhance existing platforms, reduce technical debt, and execute modernization initiatives that position iShip for future growth and operational excellence.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;The Director is responsible for building high-performing engineering organizations, establishing technical roadmaps, driving delivery excellence, and cultivating strong partnerships across business and technology teams to ensure iShip continues to meet the evolving needs of The UPS Store network while supporting long-term strategic objectives.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Required Qualifications&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Minimum 5 years leading software engineers.  &lt;/li&gt;&lt;li&gt;Minimum of 10 years of software engineering experience.&lt;/li&gt;&lt;li&gt;Demonstrated success developing software engineers through coaching, mentoring, regular feedback and clearly defined development plans.&lt;/li&gt;&lt;li&gt;Demonstrated experience leading engineering for revenue-generating or transaction-processing platforms where outages directly affect customers and business operations.&lt;/li&gt;&lt;li&gt;Strong understanding of.NET, APIs/microservices, SQL Server, distributed systems, integration patterns and CI/CD.&lt;/li&gt;&lt;li&gt;Experience supporting a distributed retail or franchise network&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Preferred Qualifications &lt;/b&gt;&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;ul&gt;&lt;li&gt;Led modernization of legacy applications toward Azure/cloud, containerized or cloud-ready architectures.&lt;/li&gt;&lt;li&gt;Microsoft Azure architecture experience&lt;/li&gt;&lt;li&gt;Modern DevOps/SRE operating practices&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"text-align:left\"&gt;&lt;br /&gt;&lt;b&gt;Employee Type:&lt;/b&gt;&lt;br /&gt; &lt;/p&gt;Permanent&lt;p style=\"text-align:left\"&gt;&lt;br /&gt;&lt;span&gt;UPS is committed to providing a workplace free of discrimination, harassment, and retaliation.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;Employer will sponsor visas for specific positions. UPS is an equal opportunity employer. UPS does not discriminate on the basis of race/color/religion/sex/national origin/veteran/disability/age/sexual orientation/gender identity or any other characteristic protected by law.&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p s
