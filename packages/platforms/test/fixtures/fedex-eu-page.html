<!doctype html><html><head><title>FedEx</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","url":"https://careers.fedex.com/handler-nights/job/0021BDBF8A5EDEF98008A1D096752FC3","directApply":true,"title":"Handler (Nights)","description":"<p>-<br><p>We have an exciting opportunity for you to join our Operations team as a <strong>Handler </strong>at <strong>Crawley.</strong></p><br /><p><strong>Who we are:</strong><br />FedEx is the largest express transportation company in the world, connecting more than 220 countries and territories. We work every moment to deliver the most important package of someone’s day. Our team of passionate people know their day-to-day work is invaluable in delivering outstanding experience to our customers. 530,000 team members strong, we are as diverse as the world we serve. We love what we do, and we do it well. Our reach is big, and so are our dreams. Join us and let's write our next chapter together.<br /></p><p><strong>Working hours: </strong> 40 per week</p><p><strong>Shift pattern: </strong>Tuesday to Saturday 00:00-08:30 hours, Saturday 00.00-08.30 hours (30 minute daily unpaid break)</p><p><strong>Salary </strong>£28,475.20 per annum plus 6% LWA</p><p><br /><strong>What you will be doing:</strong><br />• Sorting, scanning, loading, and unloading packages in a fast-paced environment<br />• Using relevant equipment and technology when needed<br />• Following our Health and Safety regulations<br />• Supporting your supervisor and team members as required<br /><br /><strong>What do you bring with you:</strong><br />• Be a great team player<br />• Be able to complete all required training<br />• Be able to communicate effectively, in a fast-moving environment<br />• Have excellent eye for detail and be able to make quick, accurate decisions<br /><br /><strong>What do we offer:</strong><br />• Attractive compensation package<br />• Training to get you started and on-the-job learning opportunities<br />• Extensive learning resources to further develop your skills and knowledge<br />• Tuition Assistance Program (*applicable for FedEx positions with a permanent contract)<br />• Employee Assistance Program for you and your family in difficult life situations<br />• Employee reduced-rate shipping<br />• Great career opportunities<br />• FedEx is one of the worlds most admired companies and trusted brands year after year<br /><br />Diversity & Inclusion is more than the workplace. It’s the cultures we celebrate, the dreams we inspire, and creating a global community where everyone is accepted. At FedEx, diversity and inclusion happen because we do it together. </p><br /><p>FedEx in the UK is Disability Confident Committed.</p><br><p> </p><br><p>FedEx was built on a philosophy that puts people first, one we take seriously. We are an equal opportunity employer and we are committed to a diverse and inclusive workforce in which we provide growth opportunities for all</p><h2>Our Company</h2><p>FedEx is one of the world's largest express transportation companies and has consistently been selected as one of the top 10 World’s Most Admired Companies by \"Fortune\" magazine. Every day FedEx delivers for its customers with transportation and business solutions, serving more than 220 countries and territories around the globe. We can serve this global network due to our outstanding team of FedEx team members, who are tasked with making every FedEx experience outstanding.</p><h2>Our Philosophy</h2><p>The People-Service-Profit philosophy (P-S-P) describes the principles that govern every FedEx decision, policy or activity. FedEx takes care of our people; they, in turn, deliver the impeccable service demanded by our customers, who reward us with the profitability necessary to secure our future. The essential element in making the People-Service-Profit philosophy such a positive force for the company is where we close the circle, and return these profits back into the business, and invest back in our people. Our success in the industry is attributed to our people. Through our P-S-P philosophy, we have a work environment that encourages team members to be innovative in delivering the highest possible quality of service to our customers. We care for their well-being, and value their contributions to the company.</p><h2>Our Culture</h2><p>Our culture is important for many reasons, and we intentionally bring it to life through our behaviors, actions and activities in every part of the world. The FedEx culture and values have been a cornerstone of our success and growth since we began in the early 1970’s. While other companies can copy our systems, infrastructure and processes, our culture makes us unique and is often a differentiating factor as we compete and grow in today’s global marketplace.</p><h2>Equality, Opportunity & Diversity (EO&D)</h2><p>Our greatest asset at FedEx is our people. We are committed to building a diverse, equitable and inclusive workforce, and offer equal opportunities, fairness, and respect to all regardless of who you are. We encourage you to apply even if you feel your experience does not align with all aspects in the job description as you could be exactly who we need for this or another opportunity.</p><p>We do not tolerate discrimination or harassment based on race, color, ethnicity, national origin, religion, sex, age, genetic information, citizenship, disability, marital status, pregnancy, sexual orientation, gender identity, gender expression, or any other characteristic protected under international and national laws and regulations. We reasonably accommodate team members and third parties to ensure equal access, inclusion, and fairness across all protected characteristics.</p></p>","identifier":{"@type":"PropertyValue","name":"Job ID","value":"RC787233"},"datePosted":"2026-11-06T11:21:35.417303+00:00","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Federal Express Corporation EU","sameAs":"https://www.fedex.com","logo":"https://d386an9otcxw2c.cloudfront.net/oms/000000/image/2024/5/LGFOE_fedex-google/fedex-google_-1x-1.png"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"9 Newton Road","addressLocality":"Crawley","addressRegion":"England","postalCode":"RH10 9TN","addressCountry":"GB"}}]}</script></head><body><a class="o-button apply-button -orange" href="https://fedex.wd1.myworkdayjobs.com/FXE-EU_External/job/FXE-EUGBRLGWT8LGWT8Crawley/Handler--Nights-_RC787233/apply" target="_blank">Apply</a></body></html>
