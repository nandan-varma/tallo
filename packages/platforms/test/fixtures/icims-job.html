<html><head><script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Pattern Energy Group LP","sameAs":"www.patternenergy.com"},"validThrough":"2027-11-19T05:00:00.000Z","jobLocation":[{"address":{"addressCountry":"US","streetAddress":"1550 Liberty Ridge Dr.","@type":"PostalAddress","postalCode":"UNAVAILABLE","addressLocality":"UNAVAILABLE","addressRegion":"PA","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"OTHER","@type":"JobPosting","description":"<h2>Overview<\/h2>\n<p>Dynamic Energy Solutions is seeking an organized and detail-oriented AP Accountant I to join our Accounting team. This position supports a variety of accounting functions, including accounts payable, cash reconciliations, journal entries, and financial reporting. Working closely with the Accounting Manager and Controller, this role will play an important part in supporting monthly, quarterly, and annual financial close processes while ensuring the accuracy and integrity of financial records.&nbsp;<\/p>\n<h2>Responsibilities<\/h2>\n<p><strong>Key Responsibilities<\/strong>&nbsp;<\/p>\n<ul>\n <li><strong>Accounts Payable:<\/strong> Manage the accounts payable inbox, process and accurately code vendor invoices, obtain appropriate approvals, and maintain supporting documentation in Sage. Review vendor statements, research discrepancies, and resolve missing invoices and outstanding balances.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li><strong>Cash Reconciliations:<\/strong> Prepare monthly and quarterly reconciliations for bank accounts and various accounting balances, including accounts payable, unapplied cash, office and vehicle leases, retainage payable, intercompany due to/due from accounts, and corporate credit card activity.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li><strong>Journal Entries:<\/strong> Prepare monthly and quarterly journal entries related to accounts payable, office leases, intercompany transactions, retainage payable, and account reclassifications.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li><strong>Expense Report Review:<\/strong> Review employee expense reports in Concur for accuracy, completeness, and appropriate expense coding. Verify compliance with applicable company benefit limits and resolve discrepancies or questions before processing for payment.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li><strong>Annual Reporting and Compliance:<\/strong> Assist with the preparation, review, and filing of annual 1099-MISC and 1099-NEC forms, including responding to related follow-up requests.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li><strong>Additional Accounting Support:<\/strong> Assist with various accounting projects and analyses, including vendor payment analysis and reconciliation of construction AIA forms.&nbsp;<\/li>\n<\/ul>\n<h2>Qualifications<\/h2>\n<p><strong>Qualifications &amp; Experience<\/strong>&nbsp;<\/p>\n<ul>\n <li>Bachelor's degree in Accounting, Finance, Business Administration, or a related field required.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>0\u20131 years of relevant professional experience; recent graduates are encouraged to apply.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Foundational knowledge of accounting principles and financial statement preparation.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Familiarity with accounts payable, accounts receivable, journal entries, and month-end closing processes.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Advanced Microsoft Excel skills and proficiency with Microsoft Office applications.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Experience with accounting software is beneficial; familiarity with Sage and Concur is a plus.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Strong attention to detail and organizational skills.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Ability to manage competing priorities, meet deadlines, and maintain accuracy in a deadline-driven environment.&nbsp;<\/li>\n<\/ul>\n<ul>\n <li>Strong analytical, problem-solving, and communication skills.&nbsp;<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><strong>What Success Looks Like<\/strong>&nbsp;<\/
